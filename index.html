<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>App Builder – Sign in</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    .logo { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p.sub { margin: 0 0 32px; color: #94a3b8; font-size: 16px; }
    #google-btn { display: flex; justify-content: center; min-height: 44px; }
    #status { margin-top: 20px; min-height: 22px; font-size: 14px; color: #94a3b8; }
    #status.error { color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🤖</div>
    <h1>App Builder</h1>
    <p class="sub">Sign in to start learning about robots.</p>
    <div id="google-btn"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    // Replace with your OAuth 2.0 Web client ID from Google Cloud Console
    // (APIs & Services > Credentials). Add this page's origin under
    // "Authorized JavaScript origins".
    var GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";

    var statusEl = document.getElementById("status");
    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    function handleCredentialResponse(response) {
      // response.credential is a Google ID token (JWT).
      // Send it to your backend to verify and start a session (not built yet).
      console.log("Google ID token received");
      setStatus("Signed in with Google.");
    }

    window.onload = function () {
      if (GOOGLE_CLIENT_ID.indexOf("YOUR_GOOGLE_CLIENT_ID") === 0) {
        setStatus("Setup needed: add your Google client ID in index.html.", true);
      }
      if (!window.google || !google.accounts) {
        setStatus("Couldn't load Google sign-in. Check your connection.", true);
        return;
      }
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        ux_mode: "popup"
      });
      google.accounts.id.renderButton(document.getElementById("google-btn"), {
        type: "standard", theme: "filled_blue", size: "large",
        text: "signin_with", shape: "pill", width: 300
      });
    };
  </script>
</body>
</html>
