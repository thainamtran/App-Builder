<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>App Builder – Home</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    .logo { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    #avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: none; object-fit: cover; }
    h1 { font-size: 26px; margin: 0 0 8px; word-break: break-word; }
    p.sub { margin: 0 0 32px; color: #94a3b8; font-size: 16px; word-break: break-all; }
    button {
      width: 100%; max-width: 300px; min-height: 48px; border: 0; border-radius: 999px;
      background: #334155; color: #f8fafc; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:active { background: #475569; }
  </style>
</head>
<body>
  <main>
    <img id="avatar" alt="">
    <div class="logo" aria-hidden="true">🤖</div>
    <h1 id="welcome">Welcome!</h1>
    <p class="sub" id="email"></p>
    <button id="signout" type="button">Sign out</button>
  </main>

  <script>
    var user = null;
    try { user = JSON.parse(sessionStorage.getItem("user")); } catch (e) {}
    if (!user) {
      window.location.replace("index.html");
    } else {
      var first = (user.name || "").split(" ")[0];
      document.getElementById("welcome").textContent =
        "Welcome, " + (first || user.email || "friend") + "!";
      document.getElementById("email").textContent = user.email || "";
      if (user.picture) {
        var img = document.getElementById("avatar");
        img.src = user.picture;
        img.referrerPolicy = "no-referrer";
        img.style.display = "block";
      }
    }

    document.getElementById("signout").addEventListener("click", function () {
      sessionStorage.removeItem("user");
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
