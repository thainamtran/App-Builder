<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>App Builder – Home</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      padding: calc(env(safe-area-inset-top) + 72px) 20px calc(env(safe-area-inset-bottom) + 96px);
    }
    main { width: 100%; max-width: 360px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    .logo { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    #avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: none; object-fit: cover; }
    h1 { font-size: 26px; margin: 0 0 8px; word-break: break-word; }
    p.sub { margin: 0; color: #94a3b8; font-size: 16px; word-break: break-all; }
    #menu-btn {
      position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 12px); z-index: 20;
      width: 48px; height: 48px; border: 0; border-radius: 12px; background: #1e293b;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer;
    }
    #menu-btn span { display: block; width: 22px; height: 2px; background: #f8fafc; border-radius: 2px; }
    #menu-btn:active { background: #334155; }
    #menu {
      position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 66px); z-index: 20;
      min-width: 180px; background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 6px;
    }
    #menu[hidden] { display: none; }
    #menu button {
      display: block; width: 100%; min-height: 44px; border: 0; border-radius: 8px;
      background: transparent; color: #f8fafc; font-size: 16px; text-align: left; padding: 0 14px; cursor: pointer;
    }
    #menu button:active { background: #334155; }

    h2 { font-size: 18px; margin: 0 0 12px; }
    #apps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    #apps li {
      display: flex; align-items: center; gap: 12px;
      background: #1e293b; border-radius: 14px; padding: 14px 16px; min-height: 64px;
    }
    #apps a.row { display: flex; align-items: center; gap: 12px; width: 100%; color: inherit; text-decoration: none; }
    #apps .text { flex: 1; min-width: 0; }
    #apps .open {
      flex: none; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600;
      border-radius: 999px; padding: 8px 16px;
    }
    #apps .icon { font-size: 28px; }
    #apps .name { font-weight: 600; word-break: break-word; }
    #apps .meta { font-size: 13px; color: #94a3b8; }
    .empty {
      text-align: center; color: #94a3b8; background: #1e293b;
      border-radius: 14px; padding: 28px 16px;
    }
    .note { margin-top: 12px; font-size: 12px; color: #64748b; text-align: center; }

    #add {
      position: fixed; right: 20px; bottom: calc(env(safe-area-inset-bottom) + 20px);
      width: 60px; height: 60px; border: 0; border-radius: 50%;
      background: #2563eb; color: #fff; font-size: 34px; line-height: 1;
      box-shadow: 0 6px 16px rgba(0,0,0,.4); cursor: pointer;
    }
    #add:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <button id="menu-btn" type="button" aria-label="Open menu" aria-haspopup="true" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div id="menu" role="menu" hidden>
    <button id="signout" type="button" role="menuitem">Sign out</button>
  </div>

  <main>
    <header>
      <img id="avatar" alt="">
      <div class="logo" aria-hidden="true">🤖</div>
      <h1 id="welcome">Welcome!</h1>
      <p class="sub" id="email"></p>
    </header>

    <section aria-labelledby="apps-title">
      <h2 id="apps-title">Your apps</h2>
      <ul id="apps"></ul>
      <div id="empty" class="empty" hidden>No apps yet. Tap + to create your first one.</div>
      <p class="note">Apps you add are saved on this device only. Saving to an account isn't built yet.</p>
    </section>
  </main>

  <button id="add" type="button" aria-label="Add a new app">+</button>

  <script>
    var user = null;
    try { user = JSON.parse(sessionStorage.getItem("user")); } catch (e) {}
    if (!user) {
      window.location.replace("index.html");
    } else {
      var first = (user.name || "").split(" ")[0];
      document.getElementById("welcome").textContent =
        "Welcome, " + (first || user.email || "friend") + "!";
      document.getElementById("email").textContent = user.email || "";
      if (user.picture) {
        var img = document.getElementById("avatar");
        img.src = user.picture;
        img.referrerPolicy = "no-referrer";
        img.style.display = "block";
      }
    }

    // Sample apps plus apps saved on this device (no backend yet).
    var samples = [
      { id: "sample-1", name: "Line-Following Bot", note: "Sample app" },
      { id: "sample-2", name: "Robot Arm Basics", note: "Sample app" },
      { id: "sample-3", name: "Obstacle Avoider", note: "Sample app" }
    ];
    var saved = [];
    try {
      saved = JSON.parse(localStorage.getItem("apps:" + ((user && user.email) || "anon"))) || [];
    } catch (e) {}
    // Older saved apps have no id yet; give them one so they can be opened.
    var changed = false;
    saved.forEach(function (a) {
      if (!a.id) { a.id = "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); changed = true; }
    });
    if (changed) {
      try { localStorage.setItem("apps:" + ((user && user.email) || "anon"), JSON.stringify(saved)); } catch (e) {}
    }
    var apps = saved.map(function (a) {
      return { id: a.id, name: a.name, note: a.description || "No description" };
    }).concat(samples);

    function renderApps() {
      var list = document.getElementById("apps");
      list.innerHTML = "";
      apps.forEach(function (a) {
        var li = document.createElement("li");
        var row = document.createElement("a");
        row.className = "row";
        row.href = "app.html?id=" + encodeURIComponent(a.id);
        var icon = document.createElement("span");
        icon.className = "icon"; icon.textContent = "🤖";
        var text = document.createElement("div");
        text.className = "text";
        var name = document.createElement("div");
        name.className = "name"; name.textContent = a.name;
        var meta = document.createElement("div");
        meta.className = "meta"; meta.textContent = a.note;
        text.appendChild(name); text.appendChild(meta);
        var open = document.createElement("span");
        open.className = "open"; open.textContent = "Open";
        row.appendChild(icon); row.appendChild(text); row.appendChild(open);
        li.appendChild(row);
        list.appendChild(li);
      });
      document.getElementById("empty").hidden = apps.length > 0;
    }
    renderApps();

    document.getElementById("add").addEventListener("click", function () {
      window.location.href = "new-app.html";
    });

    var menuBtn = document.getElementById("menu-btn");
    var menu = document.getElementById("menu");
    function setMenu(open) {
      menu.hidden = !open;
      menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    menuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      setMenu(menu.hidden);
    });
    document.addEventListener("click", function (e) {
      if (!menu.hidden && !menu.contains(e.target)) setMenu(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setMenu(false);
    });

    document.getElementById("signout").addEventListener("click", function () {
      sessionStorage.removeItem("user");
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
