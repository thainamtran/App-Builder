<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>App Builder – New app</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 32px);
    }
    main { width: 100%; max-width: 360px; margin: 0 auto; }
    a.back { color: #94a3b8; text-decoration: none; font-size: 16px; display: inline-block; padding: 8px 0; }
    .logo { font-size: 48px; line-height: 1; margin: 8px 0 12px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 24px; text-align: center; }
    label { display: block; font-size: 14px; color: #94a3b8; margin: 0 0 6px; }
    input, textarea {
      width: 100%; border: 1px solid #334155; border-radius: 12px;
      background: #1e293b; color: #f8fafc; font: inherit; font-size: 16px; padding: 14px;
    }
    input:focus, textarea:focus { outline: 2px solid #2563eb; border-color: transparent; }
    textarea { min-height: 120px; resize: vertical; }
    .field { margin-bottom: 18px; }
    #error { min-height: 20px; margin: -6px 0 12px; font-size: 14px; color: #fca5a5; }
    button.save {
      width: 100%; min-height: 52px; border: 0; border-radius: 999px;
      background: #2563eb; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button.save:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="home.html">&larr; Back</a>
    <div class="logo" aria-hidden="true">🤖</div>
    <h1>New app</h1>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">App name</label>
        <input id="name" name="name" type="text" maxlength="60" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="500"></textarea>
      </div>
      <div id="error" role="alert"></div>
      <button class="save" type="submit">Save</button>
    </form>
  </main>

  <script>
    var user = null;
    try { user = JSON.parse(sessionStorage.getItem("user")); } catch (e) {}
    if (!user) window.location.replace("index.html");

    function storageKey() { return "apps:" + (user && user.email ? user.email : "anon"); }

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value.trim();
      var description = document.getElementById("description").value.trim();
      if (!name) {
        document.getElementById("error").textContent = "Please enter an app name.";
        document.getElementById("name").focus();
        return;
      }
      var list = [];
      try { list = JSON.parse(localStorage.getItem(storageKey())) || []; } catch (err) {}
      list.unshift({ name: name, description: description, createdAt: Date.now() });
      localStorage.setItem(storageKey(), JSON.stringify(list));
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
